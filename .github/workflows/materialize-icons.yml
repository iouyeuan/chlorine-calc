name: Materialize PNG icons
on:
  push:
    branches: [main]
    paths:
      - "*.png.b64"
      - ".github/workflows/materialize-icons.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 icons to PNG and commit
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.png.b64)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .png.b64 files to materialize."
            exit 0
          fi
          for f in "${files[@]}"; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            sig="$(head -c 8 "$out" | xxd -p)"
            if [ "$sig" != "89504e470d0a1a0a" ]; then
              echo "$out is not a valid PNG (sig=$sig)" >&2
              exit 1
            fi
            ls -l "$out"
            rm -f "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "將圖示由 base64 還原為 PNG"
          git push
